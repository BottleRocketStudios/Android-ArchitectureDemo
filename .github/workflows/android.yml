name: Android CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      env:
        # Explicitly map the GitHub secrets to environment variables
        BITBUCKET_KEY: ${{ secrets.BITBUCKET_KEY }}
        BITBUCKET_SECRET: ${{ secrets.BITBUCKET_SECRET }}

    - name: Get current date
      id: date
      run: echo "date=$(date +'%m%d%Y')" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug-${{ github.run_number }}-${{ steps.date.outputs.date }}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-${{ github.run_number }}-${{ steps.date.outputs.date }}
        path: app/build/outputs/apk/debug/app-debug-${{ github.run_number }}-${{ steps.date.outputs.date }}.apk
        retention-days: 30
